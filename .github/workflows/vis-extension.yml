name: Vis extension

on:
  push:
    branches: [main]
    paths: ['extensions/vis-spel/**', '.github/workflows/vis-extension.yml']
  pull_request:
    paths: ['extensions/vis-spel/**', '.github/workflows/vis-extension.yml']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    defaults:
      run:
        working-directory: extensions/vis-spel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run --with pyright==1.1.414 pytest -q
      - name: Install verified native Spel and browser prerequisites
        if: matrix.python == '3.14'
        env:
          PYTHONPATH: src
        run: |
          uv run python -c 'import subprocess; from vis_spel import Spel; installed = Spel().install(browsers=False); subprocess.run([installed.executable, "install", "--with-deps"], check=True)'
      - name: Install pinned Lightpanda
        if: matrix.python == '3.14'
        run: |
          curl --fail --location --retry 3 https://github.com/lightpanda-io/browser/releases/download/1.0.0/lightpanda-x86_64-linux -o "$RUNNER_TEMP/lightpanda"
          printf '%s  %s\n' aa5a4b8ed53d1e38b3c73f5b2647d0a84a82e6744557f45f9a9c85858aa031c3 "$RUNNER_TEMP/lightpanda" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/lightpanda"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Verify native DOM, external CDP isolation and Lightpanda
        if: matrix.python == '3.14'
        env:
          SPEL_INTEGRATION: '1'
          SPEL_LIGHTPANDA: '1'
        run: uv run pytest tests/test_native.py -q
