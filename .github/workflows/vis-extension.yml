name: Vis extension

on:
  push:
    branches: [main]
    paths: ['extensions/vis-spel/**', '.github/workflows/vis-extension.yml', '.github/actions/setup-lightpanda/**']
  pull_request:
    paths: ['extensions/vis-spel/**', '.github/workflows/vis-extension.yml', '.github/actions/setup-lightpanda/**']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    defaults:
      run:
        working-directory: extensions/vis-spel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # setup-uv publishes no major tags from v8: pin the full version.
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run --with pyright==1.1.414 pytest -q
      - name: Install verified native Spel and browser prerequisites
        if: matrix.python == '3.14'
        env:
          PYTHONPATH: src
        run: |
          uv run python -c 'import subprocess; from vis_spel import Spel; installed = Spel().install(browsers=False); subprocess.run([installed.executable, "install", "--with-deps"], check=True)'
      - name: Install pinned Lightpanda
        if: matrix.python == '3.14'
        uses: ./.github/actions/setup-lightpanda
      - name: Verify native DOM, external CDP isolation and Lightpanda
        if: matrix.python == '3.14'
        env:
          SPEL_INTEGRATION: '1'
          SPEL_LIGHTPANDA: '1'
        run: uv run pytest tests/test_native.py -q
