name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    name: CI (${{ matrix.os }})
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      # GraalVM CE at the version in .graalvm-version.
      - name: Setup GraalVM
        uses: ./.github/actions/setup-graalvm-ce

      - uses: ./.github/actions/setup-clojure

      - uses: clojure-lsp/setup-clojure-lsp@v1.0.3
        if: runner.os == 'Linux'
        with:
          clojure-lsp-version: 2026.10.15-11.42.38

      - uses: ./.github/actions/setup-playwright

      # `spel --undetected` resolves com.blockether/spel-patchright-driver through
      # tools.deps. Build it from the pinned npm package into ~/.m2, so CI tests
      # the pin of this commit before the release publishes it.
      - name: Install Patchright driver artifact
        run: clojure -T:build install-patchright-driver

      - name: Lint (clojure-lsp)
        if: runner.os == 'Linux'
        run: make lint

      # =========================================================================
      # Tests — Linux runs with Allure reporter and uploads results as artifact.
      # macOS/Windows run plain tests (fail-fast, no Allure overhead).
      # =========================================================================

      - name: Clean Allure results
        if: runner.os == 'Linux'
        run: rm -rf allure-results allure-report

      - name: Run tests with Allure reporter (lazytest)
        id: tests-lazytest
        if: runner.os == 'Linux'
        env:
          LAZYTEST_ALLURE_GENERATE_REPORT: "false"
        run: clojure -M:test --output nested --output com.blockether.spel.allure-reporter/allure
        continue-on-error: true

      - name: Run clojure.test suite with Allure reporter
        id: tests-ct
        if: runner.os == 'Linux'
        env:
          ALLURE_CLOJURE_TEST_ENABLED: "true"
          ALLURE_CLOJURE_TEST_CLEAN: "false"
          ALLURE_CLOJURE_TEST_REPORT: "false"
        run: clojure -M:test-ct
        continue-on-error: true

      - name: Upload Allure results
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7

      - name: Fail if Linux tests failed
        if: runner.os == 'Linux' && (steps.tests-lazytest.outcome == 'failure' || steps.tests-ct.outcome == 'failure')
        run: |
          echo "::error::Tests failed (lazytest=${{ steps.tests-lazytest.outcome }}, clojure.test=${{ steps.tests-ct.outcome }})"
          exit 1

      - name: Run tests
        if: runner.os != 'Linux'
        run: clojure -M:test

      - name: Build jar
        if: runner.os == 'Linux'
        run: clojure -T:build jar

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: spel-linux-amd64
          - os: macos-latest
            artifact: spel-macos-arm64
          - os: windows-latest
            artifact: spel-windows-amd64

    runs-on: ${{ matrix.os }}
    name: Native CI (${{ matrix.os }})
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      # GraalVM CE at the version in .graalvm-version.
      - name: Setup GraalVM
        uses: ./.github/actions/setup-graalvm-ce

      - uses: ./.github/actions/setup-clojure

      - uses: ./.github/actions/setup-playwright

      # `spel --undetected` resolves com.blockether/spel-patchright-driver through
      # tools.deps. Build it from the pinned npm package into ~/.m2, so CI tests
      # the pin of this commit before the release publishes it.
      - name: Install Patchright driver artifact
        run: clojure -T:build install-patchright-driver

      - name: Build spel native image
        run: clojure -T:build native-image

      - name: Install pinned Lightpanda (Unix)
        if: runner.os != 'Windows'
        uses: ./.github/actions/setup-lightpanda

      - name: CLI bash regression tests (Unix)
        if: runner.os != 'Windows'
        env:
          SPEL_REQUIRE_LIGHTPANDA: '1'
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH"
          printf '%s\n' "$PLAYWRIGHT_BROWSERS_PATH"/*
          chmod +x target/spel
          echo '--- Running test-cli.sh ---'
          ./test-cli.sh ./target/spel

      - name: CLI smoke tests (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x target/spel
          echo "=== spel --help ==="
          target/spel --help
          echo "=== spel version ==="
          target/spel version
          echo "=== spel open --help (per-command help) ==="
          target/spel open --help
          echo "=== spel snapshot --help ==="
          target/spel snapshot --help
          echo "=== spel find --help ==="
          target/spel find --help
          echo "=== spel network --help ==="
          target/spel network --help
          echo "=== spel -h (bare short flag) ==="
          target/spel -h
          echo "=== All CLI smoke tests passed ==="

      - name: CLI smoke tests (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "=== spel --help ==="
          target/spel.exe --help
          echo "=== spel version ==="
          target/spel.exe version
          echo "=== spel open --help (per-command help) ==="
          target/spel.exe open --help
          echo "=== spel snapshot --help ==="
          target/spel.exe snapshot --help
          echo "=== spel find --help ==="
          target/spel.exe find --help
          echo "=== spel network --help ==="
          target/spel.exe network --help
          echo "=== spel -h (bare short flag) ==="
          target/spel.exe -h
          echo "=== All CLI smoke tests passed ==="

      # Regression, issues #143 and #144: on Windows `spel open https://…` threw
      # InvalidPathException, and `health`/`close` called the session's own
      # daemon an unrelated process. Every check runs, then the step fails.
      - name: CLI regression tests (Windows)
        if: runner.os == 'Windows'
        run: |
          s="ci-win-$GITHUB_RUN_ID"
          failed=0
          check() {
            if [[ "$2" == $3 ]]; then echo "ok   $1"; else echo "FAIL $1: got [$2]"; failed=1; fi
          }
          out=$(target/spel.exe --session "$s" open "https://example.com/?a=1" 2>&1 | tr -d '\r') || true
          url=$(target/spel.exe --session "$s" get url 2>&1 | tr -d '\r') || true
          check "#143 open keeps a URL with a scheme and a query" "$url" "https://example.com/?a=1"
          out=$(target/spel.exe --session "$s" open "example.com/?b=2" 2>&1 | tr -d '\r') || true
          url=$(target/spel.exe --session "$s" get url 2>&1 | tr -d '\r') || true
          check "#143 open adds https to a bare host with a query" "$url" "https://example.com/?b=2"
          out=$(target/spel.exe --session "$s" health 2>&1 | tr -d '\r') || true
          echo "$out"
          check "#144 health verifies the session's own daemon" "$out" "$s: ok*"
          out=$(target/spel.exe --session "$s" close 2>&1 | tr -d '\r') || true
          check "#144 close stops the session's own daemon" "$out" "$s: closed*"
          out=$(target/spel.exe --session "$s" health 2>&1 | tr -d '\r') || true
          check "#144 the daemon is gone after close" "$out" "$s: down*"
          exit "$failed"

      # Regression, issue #144: Windows quotes an executable path that holds a
      # space. Start the daemon from such a path, in PowerShell like the report.
      - name: CLI regression tests (Windows, PowerShell, path with a space)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The job-wide value is a Git Bash path (/c/Users/...); PowerShell needs the Windows form.
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $env:USERPROFILE '.cache\ms-playwright'
          $dir = Join-Path $env:RUNNER_TEMP 'spel dir'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $spel = Join-Path $dir 'spel.exe'
          Copy-Item target/spel.exe $spel
          $s = "ci-pwsh-$env:GITHUB_RUN_ID"
          $failed = 0
          function Check($name, $got, $pattern) {
            if ($got -like $pattern) { "ok   $name" } else { "FAIL ${name}: got [$got]"; $script:failed = 1 }
          }
          & $spel --session $s open 'https://example.com/?a=1' | Out-Null
          Check '#143 open keeps a URL with a scheme and a query' ((& $spel --session $s get url) -join "`n") 'https://example.com/`?a=1'
          Get-CimInstance Win32_Process -Filter "Name='spel.exe'" |
            Where-Object CommandLine -like '* daemon *' | ForEach-Object { "daemon: $($_.ProcessId) $($_.CommandLine)" }
          Check '#144 health verifies the daemon at a quoted path' ((& $spel --session $s health) -join "`n") "${s}: ok*"
          Check '#144 close stops the daemon at a quoted path' ((& $spel --session $s close) -join "`n") "${s}: closed*"
          Check '#144 the daemon is gone after close' ((& $spel --session $s health) -join "`n") "${s}: down*"
          exit $failed

      - name: Upload spel binary (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: target/spel

      - name: Upload spel binary (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: target/spel.exe
